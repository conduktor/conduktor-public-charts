{{- if .Values.metrics.grafana.enable }}
{{- $configMapName := printf "%s-dashboards" ( include "conduktor-gateway.fullname" . | trunc 52) -}}
{{- $gatewayNsRelease := printf "%s/%s" (include "common.names.namespace" .) .Release.Name -}}
{{/*
  Dashboards to deploy. Each entry only differs by:
    file    - key in the ConfigMap and source file under grafana-dashboards/
    suffix  - GrafanaDashboard resource name suffix (appended as "<fullname>-<suffix>")
    title   - dashboard title patched into the JSON
    loki    - (optional) also wire the Loki datasource input
    lifecycleMetrics - (optional) only render when metrics.grafana.lifecycleMetrics is true
  The fullname prefix is truncated to (62 - len suffix) so "<fullname>-<suffix>"
  always fits within the 63-char Kubernetes name limit.
*/}}
{{- $dashboards := list
  (dict "file" "gateway.json"                          "suffix" "gateway-dashboard"     "title" (printf "Conduktor Gateway [%s]" $gatewayNsRelease))
  (dict "file" "gateway-logs.json"                     "suffix" "log-dashboard"         "title" (printf "Conduktor Gateway [%s] - logs" $gatewayNsRelease) "loki" true)
  (dict "file" "gateway-lifecycle.json"                "suffix" "lifecycle-dashboard"   "title" (printf "Conduktor Gateway [%s] - Lifecycle Overview" $gatewayNsRelease) "lifecycleMetrics" true)
  (dict "file" "gateway-lifecycle-by-apikey.json"      "suffix" "apikey-dashboard"      "title" (printf "Conduktor Gateway [%s] - Lifecycle by API key" $gatewayNsRelease) "lifecycleMetrics" true)
  (dict "file" "gateway-lifecycle-by-interceptor.json" "suffix" "interceptor-dashboard" "title" (printf "Conduktor Gateway [%s] - Lifecycle by Interceptor" $gatewayNsRelease) "lifecycleMetrics" true)
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName | quote }}
  namespace: {{ include "conduktor-gateway.dashboard.namespace" . | quote }}
  labels: {{ include "conduktor-gateway.labels" . | nindent 4 }}
    {{- if .Values.metrics.grafana.labels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.metrics.grafana.labels "context" $ ) | nindent 4 }}
    {{- end }}
data:
{{- range $d := $dashboards }}
{{- if or (not $d.lifecycleMetrics) $.Values.metrics.grafana.lifecycleMetrics }}
{{- $dashboard := $.Files.Get (printf "grafana-dashboards/%s" $d.file) | fromJson }}
{{- $_ := include "conduktor-gateway.patchGrafanaDashboardInputs" (dict "dashboard" $dashboard "title" $d.title "context" $) }}
  {{ $d.file }}: >
{{ toPrettyJson $dashboard | indent 4 }}
{{- end }}
{{- end }}
{{/* Support for v5 of Grafana operator */}}
{{- if .Capabilities.APIVersions.Has "grafana.integreatly.org/v1beta1/GrafanaDashboard" }}
{{- range $d := $dashboards }}
{{- if or (not $d.lifecycleMetrics) $.Values.metrics.grafana.lifecycleMetrics }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "conduktor-gateway.fullname" $ | trunc (int (sub 62 (len $d.suffix))) }}-{{ $d.suffix }}
  namespace: {{ include "conduktor-gateway.dashboard.namespace" $ | quote }}
  labels: {{ include "conduktor-gateway.labels" $ | nindent 4 }}
    "conduktor.io/dashboard": "true"
    {{- if $.Values.metrics.grafana.labels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.metrics.grafana.labels "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  instanceSelector:
    matchLabels:
    {{- include "common.tplvalues.render" ( dict "value" $.Values.metrics.grafana.matchLabels "context" $ ) | nindent 6 }}
  {{- if $.Values.metrics.grafana.folder }}
  folder: {{ $.Values.metrics.grafana.folder | quote }}
  {{- end }}
  configMapRef:
    name:  {{ $configMapName | quote }}
    key: {{ $d.file }}
  datasources:
    {{- if $d.loki }}
    - inputName: "DS_LOKI"
      datasourceName: {{ $.Values.metrics.grafana.datasources.loki | quote }}
    {{- end }}
    - inputName: "DS_PROMETHEUS"
      datasourceName: {{ $.Values.metrics.grafana.datasources.prometheus | quote }}
    - inputName: "GATEWAY_NAME"
      datasourceName: {{ $.Release.Name | quote }}
{{- end }}
{{- end }}
{{- end }}
{{/* Support for v4 of Grafana operator */}}
{{- if .Capabilities.APIVersions.Has "integreatly.org/v1alpha1/GrafanaDashboard" }}
{{- range $d := $dashboards }}
{{- if or (not $d.lifecycleMetrics) $.Values.metrics.grafana.lifecycleMetrics }}
---
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: {{ include "conduktor-gateway.fullname" $ | trunc (int (sub 62 (len $d.suffix))) }}-{{ $d.suffix }}
  namespace: {{ include "conduktor-gateway.dashboard.namespace" $ | quote }}
  labels: {{ include "conduktor-gateway.labels" $ | nindent 4 }}
    conduktor.io/dashboard: "true"
    {{- if $.Values.metrics.grafana.labels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.metrics.grafana.labels "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  {{- if $.Values.metrics.grafana.folder }}
  customFolderName: {{ $.Values.metrics.grafana.folder | quote }}
  {{- end }}
  configMapRef:
    name:  {{ $configMapName | quote }}
    key: {{ $d.file }}
  datasources:
    {{- if $d.loki }}
    - inputName: "INPUT_DS_LOKI"
      datasourceName: {{ $.Values.metrics.grafana.datasources.loki | quote }}
    {{- end }}
    - inputName: "INPUT_DS_PROMETHEUS"
      datasourceName: {{ $.Values.metrics.grafana.datasources.prometheus | quote }}
    - inputName: "INPUT_GATEWAY_JOB_NAME"
      datasourceName: {{ $.Release.Name | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
